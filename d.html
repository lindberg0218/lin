            Modal.show({
                title: "❌ 系统初始化失败",
                content: "错误信息：" + e.message + "\n请检查控制台日志以获取详情。"
            });
        }
    },

    _initDutySelector() {
        try {
            const select = DOM.getElement(DOM_IDS.DUTY_SELECTOR);
            if (!select) return;
            select.innerHTML = AppState.config.duties
                .map(d => `<option value="${Util.escapeHTML(d)}">${Util.escapeHTML(d)}</option>`) // [W1-FIX] escapeHTML防止班次名含"或<时破坏select结构
                .join('');
            if (AppState.config.duties.length > 0) {
                select.value = AppState.config.duties[0];
                AppState.data.currentDuty = AppState.config.duties[0];
            }
        } catch (e) {
            Logger.error('Init duty selector failed', e);
        }
    },

    _closeHandlerRegistered: false,
    _registerCloseRequestHandler() {
        try {
            if (!window.electronAPI || typeof window.electronAPI.onCloseRequest !== 'function') {
                Logger.warn('[App] electronAPI.onCloseRequest 不可用，跳过注册');
                return;
            }
            if (this._closeHandlerRegistered) {
                Logger.warn('[App] onCloseRequest 已注册，跳过重复注册');
                return;
            }
            this._closeHandlerRegistered = true;
            window.electronAPI.onCloseRequest(async () => {
                Logger.info('[App] 收到主进程关闭请求');
                try {
                    if (AppState.data.modified && !AppState.system.isHistoryMode) {
                        const choice = await window.electronAPI.showExitDialog(
                            '数据尚未保存，是否保存后退出？'
                        );
                        // 0=保存退出, 1=直接退出, 2=取消
                        if (choice === 2) {
                            Logger.info('[App] 用户取消关闭');
                            return;
                        }
                        if (choice === 0) {
                            const data = await DataModule.getCurrentData();
                            // [R3-FIX] 保存失败时阻止关窗，不能静默丢数据
                            const ok = data ? await Storage.saveMainData(data) : false;
                            if (!ok) {
                                Logger.error('[App] 关闭前保存失败，阻止关窗');
                                UI.toast('❌ 保存失败，请重试后再关闭');
                                return;
                            }
                        }
                    }
                    await window.electronAPI.closeWindow();
                } catch (e) {
                    Logger.error('[App] 关闭请求处理失败', e);
                    try { await window.electronAPI.closeWindow(); } catch (_) {}
                }
            });
            Logger.info('[App] onCloseRequest 监听器已注册 [Electron Refactor]');
        } catch (e) {
            Logger.error('[App] 注册关闭监听器失败', e);
        }
    },

        async _loadSession() {
        try {
            const allData = await Storage._loadAllData();
            
            // 1. 优先恢复配置变更备份 (这是用户显式保存的，优先级最高)
            const settingsBackup = allData[CONFIG.KEYS.SETTINGS_CHANGE_BACKUP];
            if (settingsBackup) {
                // [R11-FIX] 无论成功与否都删除备份，防止损坏数据导致永远重试
                await Storage.remove(CONFIG.KEYS.SETTINGS_CHANGE_BACKUP);
                if (DataPureFunctions.validateDataSchema(settingsBackup)) {
                    // [DEL-STATION FIX] skipStationRecovery=true：
                    // 用户刚刚主动改过配置（包括删站），不能把旧数据里的站名注回去
                    await DataModule.loadData(settingsBackup, { skipStationRecovery: true });
                    Logger.info('Restored from settings change backup');
                    UI.toast('✅ 配置已更新，数据已自动恢复');
                } else {
                    Logger.warn('[_loadSession] settingsBackup schema invalid, discarded');
                    UI.toast('⚠️ 配置备份数据损坏，已进入最新数据');
                    // 继续走下面的主数据加载逻辑
                    const rawMainData2 = allData[CONFIG.KEYS.MAIN_DATA];
                    if (rawMainData2 && typeof rawMainData2 === 'object' && rawMainData2.version) {
                        // [S3-FIX] 浅拷贝后再 delete，不污染 _cachedAllData 中的对象引用
                        const mainData2 = Object.assign({}, rawMainData2);
                        delete mainData2.config;
                        await DataModule.loadData(mainData2);
                    }
                }
                return;
            }

            // 2. 加载主业务数据
            const rawMainData = allData[CONFIG.KEYS.MAIN_DATA];
            if (rawMainData && typeof rawMainData === 'object' && rawMainData.version) {
                // [CRITICAL FIX] + [S3-FIX] 浅拷贝后再 delete config，
                // 不污染 _cachedAllData 中的对象引用，防止缓存污染
                const mainData = Object.assign({}, rawMainData);
                if (mainData.config) delete mainData.config;

                const loadOk = await DataModule.loadData(mainData);
                // [Y20-FIX] loadData 返回 false 时给出明确提示，操作员不会面对空白不知原因
                if (loadOk) {
                    Logger.info('Session data loaded via electronAPI');
                } else {
                    Logger.error('[_loadSession] loadData returned false, schema may be corrupt');
                    UI.toast('⚠️ 本班数据校验失败，已进入空白初始状态，请检查数据文件');
                }
            } else {
                Logger.info('No valid session data, starting fresh');
            }
        } catch (e) {
            Logger.error('Load session failed', e);
            UI.toast('⚠️ 数据加载异常，已进入空白初始状态');
        }
    }

}; 

/* ==================== 28. 全局错误处理 ==================== */
let _errorCount = 0;
let _lastErrorTime = 0;

window.addEventListener('error', (e) => {
    const now = Date.now();
    if (now - _lastErrorTime < 60000) { _errorCount++; } else { _errorCount = 1; }
    _lastErrorTime = now;

    // [U17-FIX] sessionStorage 在 reload 后清空，改用 localStorage 使崩溃计数跨 reload 存活
    // 有人值守每天两班场景：启动后60s内连续崩溃>5次才触发停机屏，
    // 正常使用中偶发错误不应打扰操作员，计数窗口仅限启动期
    const _uptimeMs = typeof performance !== 'undefined' ? performance.now() : 0;
    let crashCount = 0;
    try {
        // [FATAL-3 FIX] Windows GPO/企业安全策略可能禁用 localStorage，
        // 在全局错误处理器内崩溃会导致整个错误捕获链失效，必须单独防护
        crashCount = Number(localStorage.getItem('hf_crash_count')) || 0;
        if (_uptimeMs < 60000) {
            crashCount++;
            localStorage.setItem('hf_crash_count', crashCount);
        }
    } catch (storageErr) {
        console.warn('[ErrorHandler] localStorage unavailable:', storageErr);
    }

    try {
        const allLogs  = (window.AppState && AppState.audit) ? AppState.audit.getAll() : [];
        const tailLogs = allLogs.slice(-50);
        const dump = {
            ts: new Date().toISOString(),
            error: { message: e.message, filename: e.filename, lineno: e.lineno, colno: e.colno, stack: e.error ? e.error.stack : 'N/A' },
            meta: { userAgent: navigator.userAgent, resolution: `${window.screen.width}x${window.screen.height}`, uptime: typeof performance !== 'undefined' ? performance.now() : 0 },
            errorCount: _errorCount, crashCount, logs: tailLogs
        };
        // [Electron Refactor] 崩溃转储写入内存 Logger，不使用 localStorage
        if (window.AppState && AppState.audit) {
            AppState.audit.push({ ts: dump.ts, lv: 'CRASH', msg: 'CrashDump', dt: dump });
        }
        // [S7-FIX] 崩溃转储必须合并到现有数据中写入，绝不能用单字段覆盖整个文件
        try {
            if (window.electronAPI && typeof window.electronAPI.saveData === 'function') {
                // 同步读缓存（不发起新IO），拿到现有数据后合并写入
                const base = Storage._cachedAllData || {};
                window.electronAPI.saveData(Object.assign({}, base, { _crashDump: dump })).catch(() => {});
            }
        } catch (_) {}
    } catch (dumpErr) {}

    console.error('[Global Error]', { message: e.message, filename: e.filename, lineno: e.lineno, errorCount: _errorCount, crashCount });

    if (crashCount > 5 && _uptimeMs < 60000) {  // 仅启动60s内连续崩溃才触发停机
        try {
            document.body.innerHTML = `
                <div style="background:#1a202c;color:white;padding:40px;font-family:Arial,sans-serif;
                     text-align:center;position:fixed;top:0;left:0;right:0;bottom:0;
                     display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:99999;">
                    <h1 style="font-size:42px;color:#fc8181;margin-bottom:20px;">⚠️ 系统异常停机</h1>
                    <p style="font-size:20px;margin:10px 0;">检测到连续 ${crashCount} 次启动崩溃</p>
                    <p style="font-size:16px;color:#a0aec0;margin:20px 0;">数据已安全保留，请联系技术人员检查日志后再处理。</p>
                    <button onclick="try{localStorage.removeItem('hf_crash_count');}catch(_){}location.reload();" style="margin-top:20px;padding:12px 32px;font-size:18px;cursor:pointer;background:#e53e3e;color:white;border:2px solid #fc8181;border-radius:6px;font-weight:bold;"><!-- [Z2-FIX][MED-BUTTON FIX] localStorage失败不阻断reload -->
                        🔄 强制重启（技术人员操作）
                    </button>
                    <p style="font-size:14px;color:#718096;">错误：${Util.escapeHTML(String(e.message || ''))} | ${Util.escapeHTML(String(e.filename || ''))}:${Util.escapeHTML(String(e.lineno || ''))}</p><!-- [U4-FIX] escapeHTML防止错误信息含<>破坏停机页 -->
                </div>`;
        } catch (ex) {}
        return;
    }

        if (_errorCount >= 20) { // 有人值守场景，20次/分才报警，减少误报干扰操作
        console.error('CRITICAL: Too many errors in 60s, system unstable');
        try {
            const errDiv = document.createElement('div');
            errDiv.style.cssText = 'background:rgba(220,38,38,0.95);color:white;padding:40px;font-family:sans-serif;text-align:center;position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:99999;';
            errDiv.innerHTML = `
                <h1 style="font-size:48px;margin-bottom:20px;">⚠️ 系统报警</h1>
                <p style="font-size:24px;margin:10px 0;">检测到连续报错 (${_errorCount}次/分)，系统可能不稳定</p>
                <p style="font-size:18px;margin:20px 0;opacity:0.8;">建议立即截图保留数据，然后手动刷新页面</p>
                <div style="margin-top:20px;">
                    <button onclick="this.parentElement.parentElement.remove()" style="padding:10px 20px;font-size:18px;cursor:pointer;background:white;color:#dc2626;border:none;border-radius:4px;font-weight:bold;">关闭警告，尝试继续操作</button>
                    <button onclick="location.reload()" style="padding:10px 20px;font-size:18px;cursor:pointer;background:#7f1d1d;color:white;border:1px solid white;border-radius:4px;margin-left:15px;">立即刷新</button>
                </div>`;
            document.body.appendChild(errDiv);
            
            // 重置计数器，避免重复弹出
            _errorCount = 0;
        } catch (ex) {
            console.error('Failed to show error screen', ex);
        }
        
        // [SRE] 移除自动刷新逻辑
        // setTimeout(() => location.reload(), 3000); 
    }

});

window.addEventListener('unhandledrejection', (e) => {
    const now = Date.now();
    if (now - _lastErrorTime < 60000) { _errorCount++; } else { _errorCount = 1; }
    _lastErrorTime = now;
    console.error('[Unhandled Promise]', e.reason);
    if (_errorCount >= 20) { // 有人值守场景，20次/分才报警，减少误报干扰操作
        UI.toast('⚠️ 检测到多个异步错误，系统可能不稳定');
    }
});

/* ==================== 紧急保存机制 [BLOCKER-2 FIX] ==================== */
function _syncSnapshotForUnload() {
    try {
        if (!AppState || AppState.system.isHistoryMode) return;
        if (!AppState.data.modified) return;
        // [FATAL-UNLOAD FIX] 已移除 beforeunload 期间的异步 IPC 调用。
        // 页面卸载时 C++ 上下文正在解绑，异步 IPC 可能触发 ACCESS_VIOLATION 崩溃。
        // 主进程的 _isDirty 标志由 notifyDirtyState 在数据变脏时实时更新，已覆盖此功能。
    } catch (e) {
        console.error('[EmergencySnapshot] Failed:', e);
    }
}

async function _asyncSaveOnHide() {
    try {
        if (!AppState || AppState.system.isHistoryMode) return;
        if (!AppState.data.modified) return;
        if (AppState.system.isSaving) return; // 正在保存中，不重复触发
        // [R6-FIX] 设置保存锁，与 _performAutoSave 保持一致
        AppState.system.isSaving = true;
        try {
            const data = DataModule.collectCurrentDataSync({ isEmergency: true });
            if (!data) return;
            // [FATAL-ASYNCSAVE FIX] 改为走 _enqueueWrite 串行队列，
            // 消除与 Storage.set（_enqueueWrite）并发写盘的竞争，防止 JSON 文件被截断为 0 字节
            await Storage._enqueueWrite(async () => {
                const allData = await Storage._loadAllData();
                const nextData = Object.assign({}, allData, { [CONFIG.KEYS.MAIN_DATA]: data });
                const result = await window.electronAPI.saveData(nextData);
                if (result && result.success) {
                    Storage._cachedAllData = nextData;
                    Storage._cacheTs = Date.now();
                    AppState.data.modified = false;
                    SaveIndicator.setSaved();
                    Logger.info('[AsyncSave] Visibility-hide save succeeded');
                } else {
                    Logger.error('[AsyncSave] Visibility-hide save failed', result?.error);
                }
            });
        } finally {
            AppState.system.isSaving = false;
        }
    } catch (e) {
        console.error('[AsyncSave] Failed:', e);
        if (AppState) AppState.system.isSaving = false;
    }
}

window.addEventListener('beforeunload', _syncSnapshotForUnload);
document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
        _asyncSaveOnHide(); // 异步，不阻塞，但此时进程仍存活所以 Promise 能完成
    }
});

/* ==================== DOMContentLoaded 入口 ==================== */
window.addEventListener('DOMContentLoaded', () => {

    // [HIGH-DRAG FIX] 全局拦截文件拖拽导航：Electron 默认允许拖入文件并导航到 file://，
    // 操作员不小心拖入文件会销毁整个应用上下文，未存盘数据蒸发。
    document.addEventListener('dragover', (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'none'; }, false);
    document.addEventListener('drop', (e) => { e.preventDefault(); }, false);

    // 全局焦点修复 + 模态框关闭防穿透
    document.addEventListener('click', (e) => {
        if (Modal._clickShielded) {
            e.stopPropagation();
            e.preventDefault();
            return;
        }
        const target = e.target;
        if (target && (target.tagName === 'INPUT' || target.tagName === 'SELECT' || target.tagName === 'TEXTAREA')) {
            setTimeout(() => {
                try { if (target && typeof target.focus === 'function') target.focus(); }
                catch (e) { console.error('Focus failed', e); }
            }, 10);
        }
    }, true);

    document.addEventListener('focusout', () => {
        setTimeout(() => { if (document.activeElement === document.body) document.body.blur(); }, 50);
    });

    App.init().then(() => {
        AppActions._cleanupHistory().catch(e => console.warn('[Cleanup]', e));
    }).catch(e => {
        console.error('App init critical failure:', e);
        const fatal = document.createElement('div');
        fatal.style.cssText = [
            'position:fixed', 'top:0', 'left:0', 'right:0', 'bottom:0',
            'background:#1a202c', 'color:white', 'display:flex',
            'flex-direction:column', 'justify-content:center', 'align-items:center',
            'z-index:99999', 'font-family:Arial,sans-serif', 'text-align:center', 'padding:40px'
        ].join(';');
        fatal.innerHTML = `
            <h1 style="font-size:32px;color:#fc8181;margin-bottom:20px;">❌ 系统初始化失败</h1>
            <p style="font-size:18px;margin:10px 0;">${Util.escapeHTML(e.message)}</p>
            <p style="font-size:14px;color:#a0aec0;margin:20px 0;">请检查控制台日志（Ctrl+Shift+I），或联系技术人员</p>
        `;
        document.body.appendChild(fatal);
    });
});
</script>
