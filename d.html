            AppState.system.isComposing = false;
            if (e.target && e.target.matches('.row-input, .inv-input, .ret-input')) {
                self.onCellInput(e.target);
            }
        });

        container.addEventListener('input', (e) => {
            if (AppState.system.isComposing) return;
            const t = e.target;
            // [冗余点3 FIX] 合并两个重复的 input 监听器为一个，逻辑不变
            if (t.matches('.row-input, .inv-input, .ret-input')) {
                self.onCellInput(t);
            } else if (t.matches('.ret-detail, .ret-num')) {
                if (!AppState.system.isHistoryMode) {
                    StatsModule.update();
                    AppActions.triggerAutoSave();
                    AppState.data.modified = true;
                    ReturnModule.checkAutoRow();
                }
            }
        });

        container.addEventListener('change', (e) => {
            if (e.target.matches('select.row-input')) self.onCellInput(e.target);
            if (e.target.matches('.ret-f-stat, .ret-t-stat')) {
                if (!AppState.system.isHistoryMode) {
                    StatsModule.update();
                    AppActions.triggerAutoSave();
                    AppState.data.modified = true;
                    ReturnModule.checkAutoRow();
                }
            }
        });

        container.addEventListener('paste', (e) => {
            if (!e.target.matches('.row-input')) return;
            const text = (e.clipboardData || window.clipboardData).getData('text');
            if (!text.includes('\t') && !text.includes('\n')) return;
            e.preventDefault();
            const allRows = text.split(/\r?\n/).filter(r => r.trim());
            // [HIGH-PASTE FIX] 限制单次粘贴行数，防止超大粘贴卡死 UI 和撑爆 IPC
            const MAX_PASTE_ROWS = 50;
            const rows = allRows.slice(0, MAX_PASTE_ROWS);
            if (allRows.length > MAX_PASTE_ROWS) {
                UI.toast(`⚠️ 粘贴内容超过 ${MAX_PASTE_ROWS} 行，已自动截断`);
            }
            const currentTr = e.target.closest('tr');
            if (!currentTr) return;
            const currentTd = e.target.closest('td');
            const cells = Array.from(currentTr.querySelectorAll('td'));
            const startColIdx = cells.indexOf(currentTd);
            let trCursor = currentTr;
            // [PASTE-LOCK FIX] 粘贴期间挂起 onCellInput 的行数清理/扩容，
            // 防止 _removeEmptyRows 删行导致 trCursor.nextElementSibling 失效，后续数据丢失
            AppState.system.isPasting = true;
            try {
            rows.forEach(rowStr => {
                if (!trCursor) return;
                const cols = rowStr.split('\t');
                const inputs = Array.from(trCursor.querySelectorAll('.row-input'));
                cols.forEach((val, ci) => {
                    const targetInput = inputs[startColIdx + ci];
                    if (targetInput && targetInput.tagName === 'INPUT') {
                        targetInput.value = val.trim().slice(0, 100); // 同步 maxlength
                        targetInput.dispatchEvent(new Event('input', { bubbles: true }));
                    }
                });
                trCursor = trCursor.nextElementSibling;
            });
            if (allRows.length <= MAX_PASTE_ROWS) {
                UI.toast(`✅ 已自动填充 ${rows.length} 行 Excel 数据`);
            }
            } finally {
                AppState.system.isPasting = false;
                // 粘贴结束后，一次性补全空行缓冲，确保表格末尾有行可继续录入
                const tbody = currentTr.closest('tbody');
                if (tbody) {
                    const tableEl = tbody.closest('table');
                    const station = tableEl?.dataset.station;
                    const side    = tableEl?.dataset.side;
                    if (station && side) DataModule._ensureEmptyBuffer(tbody, station, side, 2);
                }
            }
        });

        this.initialized = true;
        Logger.info('TableModule initialized');
    },

        onCellInput(el) {
        try {
            if (AppState.system.isHistoryMode) { UI.toast("⚠️ 历史模式"); return; }
            AppState.data.modified = true;

            const row   = el.closest('tr');
            if (!row) return;
            const tbody = row.parentElement;
            const table = row.closest('.work-table');
            if (!table) return;

            const side  = table.dataset.side;
            const block = row.closest('.station-block');

            if (block) {
                const station = block.dataset.name;
                const lastRow       = tbody.lastElementChild;
                const secondLastRow = lastRow ? lastRow.previousElementSibling : null;

                // [R20-FIX] 排除参考行，与 _addRows 中的计数逻辑保持一致
                const currentRows = tbody.querySelectorAll('tr:not(.history-ref-row)').length;

                // [MEDIUM-C FIX] 使用 TableModule 属性替换局部 const
                // [PASTE-LOCK FIX] 粘贴期间跳过行数清理，防止 trCursor 游标失效
                if (!AppState.system.isPasting && currentRows >= this.MAX_CLEANUP_THRESHOLD) this._removeEmptyRows(tbody, 5);

                if (currentRows >= this.MAX_ROWS_PER_TABLE) {
                    console.warn(`Station ${station} reached hard limit ${this.MAX_ROWS_PER_TABLE}`);
                    return; 
                }

                if (this._rowHasData(lastRow)) {
                    this._addRows(tbody, station, side);
                    this._addRows(tbody, station, side);
                } else if (this._rowHasData(secondLastRow)) {
                    this._addRows(tbody, station, side);
                }
            }

            StatsModule.update();
            AppActions.triggerAutoSave();
        } catch (e) {
            Logger.error('Cell input failed', e);
        }
    },

    _rowHasData(tr) {
        if (!tr || tr.classList.contains('history-ref-row')) return false;
        return Array.from(tr.querySelectorAll('.row-input')).some(i => i.value && i.value.trim() !== '');
    },

    _removeEmptyRows(tbody, count = 10) {
        const rows = Array.from(tbody.querySelectorAll('tr'));
        let removed = 0;
        for (let i = rows.length - 1; i >= 0 && removed < count; i--) {
            const row = rows[i];
            if (!this._rowHasData(row) && !row.classList.contains('history-ref-row')) {
                row.remove();
                removed++;
            }
        }
        if (removed > 0) Logger.info(`Removed ${removed} empty rows`);
    },

    _addRows(tbody, station, side) {
        try {
            const currentRows = Array.from(tbody.rows).filter(r => !r.classList.contains('history-ref-row')).length;
            if (currentRows >= this.MAX_ROWS_PER_TABLE) {
                // 只有真的到了 500 行才提示，平时完全无感
                UI.toast(`⚠️ 单站记录已达 ${this.MAX_ROWS_PER_TABLE} 行上限，建议交班`);
                return;
            }

            const fields = side === 'departure' ? CONFIG.FIELDS.DEPARTURE : CONFIG.FIELDS.ARRIVAL;
            // [CRITICAL-05] 使用版本戳缓存，随配置变更自动重建
            const cachedOpts = this._getOptions();

            const cellsHtml = fields.map(f => {
                if (f.t === 'select') {
                    return `<td><select class="row-input std-select-box" data-key="${f.k}">${cachedOpts}</select></td>`;
                } else {
                    return `<td><input type="text" class="row-input" data-key="${f.k}" maxlength="100"></td>`;
                }
            }).join('');

            tbody.insertAdjacentHTML('beforeend', `<tr>${cellsHtml}</tr>`);
        } catch (e) {
            Logger.error('Add rows failed', e);
        }
    }
};

/* ==================== 18. 统计模块 ==================== */
const StatsModule = {
    _updateTimer: null,

    update() {
        clearTimeout(this._updateTimer);
        this._updateTimer = setTimeout(() => this._doUpdate(), 300);
    },

    _doUpdate() {
        try {
            let totalArr = 0, totalDep = 0;
            AppState.config.stations.forEach(s => {
                const { arrival, departure } = this._countStation(s);
                const safeId = Util.toId(s); // [T8-FIX] 与 renderStats 保持一致
                DOM.setText(`sc-arr-${safeId}`, arrival);
                DOM.setText(`sc-dep-${safeId}`, departure);
                totalArr += arrival;
                totalDep += departure;
            });
            DOM.setText('total-all-arr', totalArr);
            DOM.setText('total-all-dep', totalDep);
            this._updateInventorySum();
        } catch (e) {
            Logger.error('Stats update failed', e);
        }
    },

    _countStation(station) {
        try {
            let arrival = 0, departure = 0;
            const arrTable = DOMCache.getTable(station, 'arrival');
            const depTable = DOMCache.getTable(station, 'departure');
            if (arrTable) {
                // [S11-FIX] 排除参考行，防止上班参考数据被计入本班统计
                arrTable.querySelectorAll('tbody tr:not(.history-ref-row)').forEach(tr => {
                    const host = tr.querySelector('[data-key="hostNo"]')?.value || "";
                    if (host.trim() !== "" && !tr.classList.contains('is-handover-data')) arrival++;
                });
            }
            if (depTable) {
                depTable.querySelectorAll('tbody tr:not(.history-ref-row)').forEach(tr => {
                    const host = tr.querySelector('[data-key="hostNo"]')?.value || "";
                    if (host.trim() !== "" && !tr.classList.contains('is-handover-data')) departure++;
                });
            }
            return { arrival, departure };
        } catch (e) {
            Logger.error(`Count station ${station} failed`, e);
            return { arrival: 0, departure: 0 };
        }
    },

    _updateInventorySum() {
        try {
            let sum = 0;
            DOM.queryAll('.inv-input').forEach(input => {
                const val = Util.safeInt(input.value, 0);
                if (val >= 0) sum += val;
            });
            DOM.setText(DOM_IDS.INV_TOTAL_SUM, `总计: ${sum}`);
        } catch (e) {
            Logger.error('Update inventory sum failed', e);
        }
    }
};

/* ==================== 19. 纯函数：数据提取与验证 ==================== */
const DataPureFunctions = {
    // [W2-FIX] 删除 filterValidRows 死代码（字段名拼写错误 isHandover→_isHandover，且从未被调用）

    // [CRITICAL-03/04] 增强校验：时间戳范围 + notes类型
    validateDataSchema(data) {
        try {
            if (!data || typeof data !== 'object') return false;
            if (!data.version) return false;
            if (!/^\d{4}\./.test(data.version)) return false;

            // 只校验 timestamp 是数字类型，不做范围判断：避免误杀合法旧班数据
            if (typeof data.timestamp !== 'number') return false;

            if (!data.stations || typeof data.stations !== 'object') return false;
            for (const stName in data.stations) {
                const st = data.stations[stName];
                if (!st || typeof st !== 'object') return false;
                if (!Array.isArray(st.arrival) || !Array.isArray(st.departure)) return false;
            }

            // notes 类型校验 [R14-FIX] 向后兼容：不存在则接受（旧版数据可能缺字段），存在则校验类型
            // [W20-FIX] 原逻辑强制要求 notes 存在，导致旧版无 notes 数据升级时被拒绝，数据丢失
            if (data.notes !== undefined) {
                if (typeof data.notes !== 'object' || data.notes === null) return false;
                for (const k of ['imp', 'safe', 'hand']) {
                    if (data.notes[k] !== undefined && typeof data.notes[k] !== 'string') return false;
                }
            }

            // [X1-FIX] inv/rets 向后兼容：缺失时接受（旧版数据），存在时校验类型
            if (data.inv !== undefined && (typeof data.inv !== 'object' || data.inv === null)) return false;
            if (data.rets !== undefined && !Array.isArray(data.rets)) return false;

            return true;
        } catch (e) {
            return false;
        }
    },

    rolloverDepartureRows(departureRows) {
        return departureRows
            .filter(row => !row.toStation || row.toStation.trim() === '')
            .map(row => ({ ...row, _isHandover: true }));
    }
};

/* ==================== 20. 数据序列化模块 ==================== */
const DataModule = {

    collectCurrentDataSync(opts = {}) {
        const data = {
            version: CONFIG.VERSION,
            timestamp: Date.now(),
            duty: DOM.getValue ? DOM.getValue(DOM_IDS.DUTY_SELECTOR) : '',
            stations: {},
            notes: {
                imp:  Util.truncate(DOM.getValue ? DOM.getValue(DOM_IDS.NOTE_IMPORTANT) : '', 500),
                safe: Util.truncate(DOM.getValue ? DOM.getValue(DOM_IDS.NOTE_SAFETY)    : '', 500),
                hand: Util.truncate(DOM.getValue ? DOM.getValue(DOM_IDS.NOTE_HANDOVER)  : '', 500)
            },
            inv: {},
            rets: []
        };
        if (opts.isEmergency) data._emergencySave = true;
        if (AppState.config && AppState.config.stations) {
            AppState.config.stations.forEach(s => {
                data.stations[s] = {
                    arrival:   this._collectTableData(s, 'arrival'),
                    departure: this._collectTableData(s, 'departure')
                };
            });
        }
        try {
            DOM.queryAll('.inv-input').forEach(input => {
                const stat = input.dataset.stat;
                if (stat) data.inv[stat] = Util.safeInt(input.value, 0);
            });
        } catch (e) {}
        try { data.rets = this._collectReturnData(); } catch (e) {}
        return data;
    },

    async getCurrentData() {
        try {
            const data = this.collectCurrentDataSync();
            if (typeof JSON !== 'undefined') {
                const approxBytes = JSON.stringify(data).length * 2;
                if (approxBytes > CONFIG.WARN_WRITE_SIZE_BYTES) {
                    Logger.warn(`Data size: ${Math.round(approxBytes/1024)}KB — consider reducing rows`);
                }
            }
            return data;
        } catch (e) {
            Logger.error('Get current data failed', e);
            return null;
        }
    },

    _sanitizeInput(str, maxLen = 100) {
        if (!str) return '';
        // [HIGH-SCAN FIX] 清除 ASCII 控制字符（含扫码枪输出的 \r\n\t 和不可见控制符）
        // 防止 "A001\r" !== "A001" 导致对账失败，以及 JSON 跨系统对接损坏
        // [IME-FIX] JS 硬截断：中文拼音输入法在 composing 状态可突破 HTML maxlength 属性，
        // 必须在数据收集层再做一次强制截断，确保写盘数据不超长
        return str.trim()
            .replace(/[\x00-\x1F\x7F]/g, '')      // ASCII 控制字符（含 \r \n \t）
            .replace(/[\u200b-\u200f\u2028\u2029\uFEFF\u00AD]/g, '') // 零宽/软连字符
            .substring(0, maxLen);                   // 硬截断，IME 无法绕过
    },

    _collectTableData(station, side) {
        try {
            const rows = [];
            const table = DOMCache.getTable(station, side);
            if (!table) return rows;
            const tbody = table.querySelector('tbody');
            if (!tbody) return rows;
            tbody.querySelectorAll('tr:not(.history-ref-row)').forEach(tr => {
                const rowData = {};
                let hasData = false;
                tr.querySelectorAll('.row-input').forEach(input => {
                    const key = input.dataset.key;
                    if (key) {
                        const value = this._sanitizeInput(input.value);
                        rowData[key] = value;
                        if (value) hasData = true;
                    }
                });
                if (hasData) {
                    rowData._isHandover = tr.classList.contains('is-handover-data');
                    rows.push(rowData);
                }
            });
            return rows;
        } catch (e) {
            Logger.error(`Collect table data failed for ${station}/${side}`, e);
            return [];
        }
    },

    _collectReturnData() {
        try {
            const rets = [];
            const tbody = DOM.getElement(DOM_IDS.RETURN_TBODY);
            if (!tbody) return rets;
            tbody.querySelectorAll('tr').forEach(tr => {
                const fStat  = tr.querySelector('.ret-f-stat')?.value  || '';
                const detail = tr.querySelector('.ret-detail')?.value  || '';
                const tStat  = tr.querySelector('.ret-t-stat')?.value  || '';
                const num    = Util.safeInt(tr.querySelector('.ret-num')?.value, 0);
                if (fStat || detail || num > 0) {
                    rets.push({
                        f: Util.truncate(fStat, 50),
                        v: Util.truncate(detail, 200),
                        t: Util.truncate(tStat, 50),
                        n: num,
                        _isHandover: tr.classList.contains('is-handover-data')
                    });
                }
            });
            return rets;
        } catch (e) {
            Logger.error('Collect return data failed', e);
            return [];
        }
    },

    async loadData(data, { skipStationRecovery = false } = {}) {
        try {
            if (!data) return false;
            if (!DataPureFunctions.validateDataSchema(data)) {
                Logger.error('Invalid data schema');
                return false;
            }
            if (data.duty) {
                DOM.setValue(DOM_IDS.DUTY_SELECTOR, data.duty);
                AppState.data.currentDuty = data.duty;
            }

            const prevBackup = await (async () => {
                try {
                    // [X9-FIX] PREVIOUS_BACKUP 始终以普通对象存储，_unwrap 路径永远不触发，直接返回原值
                    const raw = await Storage.get(CONFIG.KEYS.PREVIOUS_BACKUP);
                    return raw || null;
                } catch (e) {
                    console.warn('Failed to load previous backup', e);
                    return null;
                }
            })();

            if (data.stations) {
                // [FATAL-2 FIX] 配置损坏重置为默认后，主数据可能含有非默认车站。
                // 若不注回，DOMCache.getTable 返回 null，数据不渲染，
                // 下次 autoSave 只收集已渲染车站，未渲染车站数据被静默覆写丢失。
                // [DEL-STATION FIX] skipStationRecovery=true 时跳过注回：
                // 用户主动删除车站后保存配置，settingsBackup 里仍含旧车站数据，
                // 若不跳过，被删车站会被重新注回 AppState.config.stations，导致删除无效。
                let needRerender = false;
                if (!skipStationRecovery) {
                    Object.keys(data.stations).forEach(stationName => {
                        if (!AppState.config.stations.includes(stationName)) {
                            AppState.config.stations.push(stationName);
                            if (!AppState.config.dropdowns.includes(stationName)) {
                                AppState.config.dropdowns.push(stationName);
                            }
                            needRerender = true;
                            Logger.warn(`[Data Recovery] 配置遗失车站已强制恢复: ${stationName}`);
                        }
                    });
                }
                if (needRerender) {
                    // 重新渲染补全缺失的 DOM 节点，刷新 DOMCache 使 getTable 能命中
                    RenderModule.renderStations();
                    DOMCache.refreshTables();
                }
                Object.entries(data.stations).forEach(([station, tables]) => {
                    if (tables.arrival)   this._loadTableData(station, 'arrival',   tables.arrival,   prevBackup);
                    if (tables.departure) this._loadTableData(station, 'departure', tables.departure, null);
                });
            }
            if (data.notes) {
                DOM.setValue(DOM_IDS.NOTE_IMPORTANT, data.notes.imp  || '');
                DOM.setValue(DOM_IDS.NOTE_SAFETY,    data.notes.safe || '');
                DOM.setValue(DOM_IDS.NOTE_HANDOVER,  data.notes.hand || '');
            }
            if (data.inv) {
                Object.entries(data.inv).forEach(([stat, val]) => {
                    // [Y1-FIX] data-stat attribute 已转义，selector 中 stat 值同样需转义以正确匹配
                    const input = document.querySelector(`.inv-input[data-stat="${Util.escapeHTML(stat)}"]`);
                    if (input) input.value = val;
                });
            }
            if (data.rets) this._loadReturnData(data.rets);
            StatsModule.update();
            if (typeof DuplicateCheckModule !== 'undefined' && DuplicateCheckModule.rebuildIndex) {
                DuplicateCheckModule.rebuildIndex();
            }
            Logger.info('Data loaded successfully');
            return true;
        } catch (e) {
            Logger.error('Load data failed', e);
            return false;
        }
    },

    _loadTableData(station, side, rowsData, prevBackup) {
        try {
            const table = DOMCache.getTable(station, side);
            if (!table) return;
            const tbody = table.querySelector('tbody');
            if (!tbody) return;
            tbody.innerHTML = '';

            if (side === 'arrival' && !AppState.system.isHistoryMode && prevBackup) {
                this._appendHistoryReference(tbody, station, prevBackup);
            }

            if (Array.isArray(rowsData) && rowsData.length > 0) {
                const fields = side === 'departure' ? CONFIG.FIELDS.DEPARTURE : CONFIG.FIELDS.ARRIVAL;
                const opts   = TableModule._getOptions();

                // 第一步：批量生成所有行HTML（纯字符串，零DOM访问）
                const rowsHtml = rowsData.map(() => {
                    const cells = fields.map(f =>
                        f.t === 'select'
                            ? `<td><select class="row-input std-select-box" data-key="${f.k}">${opts}</select></td>`
                            : `<td><input type="text" class="row-input" data-key="${f.k}"></td>`
                    ).join('');
                    return `<tr>${cells}</tr>`;
                }).join('');

                // 第二步：一次性插入（触发一次布局，而非N次）
                tbody.insertAdjacentHTML('beforeend', rowsHtml);

                // 第三步：按索引填值，并处理交班标记
                const newRows = tbody.querySelectorAll('tr:not(.history-ref-row)');
                rowsData.forEach((rowData, idx) => {
                    const tr = newRows[idx];
                    if (!tr || !rowData) return;
                    let isHandover = false;
                    Object.entries(rowData).forEach(([key, value]) => {
                        if (key === '_isHandover') { if (value) isHandover = true; return; }
                        const input = tr.querySelector(`[data-key="${key}"]`);
                        if (!input) return;
                        if (input.tagName === 'SELECT' && value) {
                            // [SELECT-GHOST FIX] select.value 赋值在 option 不存在时静默失败，
                            // 数据显示为空，下次保存时该字段丢失。
                            // 动态注入遗留 option 并标记警告色保全数据，提示管理员站名已变更。
                            const exists = Array.from(input.options).some(o => o.value === String(value));
                            if (!exists) {
                                const ghost = document.createElement('option');
                                ghost.value = String(value);
                                ghost.textContent = `⚠️${value}(已删)`;
                                ghost.style.color = '#dc2626';
                                input.appendChild(ghost);
                            }
                        }
                        input.value = value;
                    });
                    if (isHandover) {
                        tr.classList.add('is-handover-data');
                        tr.querySelectorAll('.row-input').forEach(i => i.classList.add('is-handover-data'));
                    }
                });
            } else if (!Array.isArray(rowsData)) {
                Logger.warn(`Invalid rowsData for ${station} ${side}`, rowsData);
            }

            this._ensureEmptyBuffer(tbody, station, side, 2);
        } catch (e) {
            Logger.error(`Load table data failed for ${station}/${side}`, e);
        }
    },

    _appendHistoryReference(tbody, station, prevBackupObj) {
        try {
            if (!prevBackupObj) return;

            const dataRoot = prevBackupObj.payload || prevBackupObj;
            
            if (!dataRoot || !dataRoot.stations) return;
            
            const prevStationData = dataRoot.stations[station];
            if (!prevStationData?.arrival?.length) return;

            // [U14-FIX] 跳过交班结转行，只取实际到达的最后一条作为参考
            const candidates = prevStationData.arrival.filter(r => !r._isHandover && r.hostNo);
            if (!candidates.length) return;
            const lastRowData = candidates[candidates.length - 1];

            const cells = CONFIG.FIELDS.ARRIVAL.map(f =>
                `<td>${Util.escapeHTML(String(lastRowData[f.k] || ''))}</td>`
            ).join('');
            tbody.insertAdjacentHTML('afterbegin',
                `<tr class="history-ref-row" title="上一班最后一条到达记录 (参考)">${cells}</tr>`
            );
        } catch (e) {
            console.warn('History reference load error:', e);
        }
    },

    _ensureEmptyBuffer(tbody, station, side, bufferCount) {
        let emptyCount = 0;
        for (let i = tbody.rows.length - 1; i >= 0; i--) {
            const tr = tbody.rows[i];
            if (tr.classList.contains('history-ref-row')) continue;
            const inputs  = Array.from(tr.querySelectorAll('.row-input'));
            const hasData = inputs.some(input => input.value && input.value.trim() !== '');
            if (!hasData) { emptyCount++; } else { break; }
        }
        const needed = bufferCount - emptyCount;
        for (let k = 0; k < needed; k++) TableModule._addRows(tbody, station, side);
    },

    _loadReturnData(retsData) {
        try {
            const tbody = DOM.getElement(DOM_IDS.RETURN_TBODY);
            if (!tbody) return;
            tbody.innerHTML = '';
            retsData.forEach(ret => {
                const tr = document.createElement('tr');
                if (ret._isHandover) tr.classList.add('is-handover-data');
                tr.innerHTML = ReturnModule._createRowHTML(ret);
                tbody.appendChild(tr);
            });
            if (tbody.rows.length === 0) ReturnModule.addRow();
            if (ReturnModule.checkAutoRow) ReturnModule.checkAutoRow();
        } catch (e) {
            Logger.error('Load return data failed', e);
        }
    }
};

/* ==================== 21. 回送表模块 ==================== */
const ReturnModule = {
    async init() {
        try {
            const tbody = DOM.getElement(DOM_IDS.RETURN_TBODY);
            if (!tbody) return;
            if (tbody.rows.length === 0) this.addRow();
            this.checkAutoRow();
            Logger.info('Return module initialized');
        } catch (e) {
            Logger.error('Return module init failed', e);
        }
    },

    _createRowHTML(ret = {}) {
        const makeOptions = (selected) =>
            AppState.config.stations.map(s =>
                `<option value="${Util.escapeHTML(s)}" ${s === selected ? 'selected' : ''}>${Util.escapeHTML(s)}</option>`
            ).join('');
        return `
            <td><select class="ret-f-stat std-select-box">
                <option value=""></option>${makeOptions(ret.f)}
            </select></td>
            <td><input type="text" class="ret-detail" value="${Util.escapeHTML(ret.v || '')}"></td>
            <td><select class="ret-t-stat std-select-box">
                <option value=""></option>${makeOptions(ret.t)}
            </select></td>
            <td><input type="number" class="ret-num" min="1" max="99" value="${ret.n != null && ret.n !== '' ? ret.n : ''}"></td>
            <td><button class="btn btn-prev" style="font-size:12px; padding:4px 8px;" onclick="ReturnModule.removeRow(this)">删除</button></td>
        `;
    },

    addRow() {
        try {
            const tbody = DOM.getElement(DOM_IDS.RETURN_TBODY);
            if (!tbody) return;
            const tr = document.createElement('tr');
            tr.innerHTML = this._createRowHTML();
            tbody.appendChild(tr);
        } catch (e) {
            Logger.error('Add return row failed', e);
        }
    },

    checkAutoRow() {
        const tbody = DOM.getElement(DOM_IDS.RETURN_TBODY);
        if (!tbody) return;
        const lastRow = tbody.lastElementChild;
        if (lastRow && this._hasData(lastRow)) this.addRow();
        while (tbody.rows.length > 1) {
            const last = tbody.lastElementChild;
            const prev = last.previousElementSibling;
            if (last && prev && !this._hasData(last) && !this._hasData(prev)) {
                last.remove();
            } else { break; }
        }
    },

    // [ES6+] 简化为 some 链式调用
    _hasData(tr) {
        return ['.ret-f-stat', '.ret-detail', '.ret-t-stat', '.ret-num']
            .some(sel => !!tr.querySelector(sel)?.value?.trim());
    },

    removeRow(btn) {
        try {
            const tr = btn.closest('tr');
            if (!tr) return;
            const tbody = tr.parentElement;
            if (this._hasData(tr)) {
                Modal.show({
                    title: '⚠️ 确认删除',
                    content: '已填写回送内容，确定要删除这一行吗？',
                    onConfirm: () => this._doRemoveRow(tr, tbody)
                });
                return;
            }
            this._doRemoveRow(tr, tbody);
        } catch (e) {
            Logger.error('Remove return row failed', e);
        }
    },

    _doRemoveRow(tr, tbody) {
        const focusInheritor = (() => {
            const colIndex = Array.from(tr.children).findIndex(td => td.contains(document.activeElement));
            const findInput = (targetTr) => {
                if (!targetTr) return null;
                const tds = Array.from(targetTr.children);
                const td = tds[colIndex] || tds[0];
                return td ? td.querySelector('input, select') : null;
            };
            return findInput(tr.nextElementSibling) || findInput(tr.previousElementSibling);
        })();
        if (tbody.rows.length <= 1) {
            tr.querySelectorAll('input, select').forEach(el => el.value = '');
        } else {
            tr.remove();
        }
        if (focusInheritor) setTimeout(() => focusInheritor.focus(), 0);
        this.checkAutoRow();
        StatsModule.update();
        AppActions.triggerAutoSave();
    }
}; // ReturnModule 结束

/* ==================== 22. 对账模块 ==================== */
const ReconcileModule = {
    async reconcile() {
        try {
            let matched = 0, unmatched = 0;
            const depIndex = new Map();
            // [U13-FIX] 排除 history-ref-row，上班参考数据不参与本班对账
            DOM.queryAll('.work-table[data-side="departure"] tbody tr:not(.history-ref-row)').forEach(tr => {
                const host = tr.querySelector('[data-key="hostNo"]')?.value?.trim();
                if (host) {
                    const toStation = tr.querySelector('[data-key="toStation"]')?.value;
                    if (!toStation || !depIndex.has(host)) {
                        depIndex.set(host, { row: tr, station: tr.closest('.station-block')?.dataset.name });
                    }
                }
            });
            // [U13-FIX] 到达表同样排除 history-ref-row
            DOM.queryAll('.work-table[data-side="arrival"] tbody tr:not(.history-ref-row)').forEach(arrRow => {
                const host = arrRow.querySelector('[data-key="hostNo"]')?.value?.trim();
                if (!host) return;
                const hasData = arrRow.querySelector('[data-key="trainNo"]')?.value?.trim();
                if (hasData) return; // 已有车次，跳过（不计入未匹配，行已完整）
                if (depIndex.has(host)) {
                    const depData    = depIndex.get(host);
                    const depRow     = depData.row;
                    const depStation = depData.station;
                    const arrStation = arrRow.closest('.station-block')?.dataset.name;
                    if (depStation === arrStation) {
                        unmatched++; // [X2-FIX] 同站冲突行计入未匹配，而非静默跳过
                        return;
                    }
                    // [MED-RECONCILE FIX] JS 直接赋值不触发 input/change 事件，
                    // DuplicateCheckModule 依赖 input 事件，必须手动触发
                    const _fireInput = (el) => el && el.dispatchEvent(new Event('input', { bubbles: true }));
                    ['trainNo', 'locoNo', 'battNo'].forEach(key => {
                        const val   = depRow.querySelector(`[data-key="${key}"]`)?.value;
                        const input = arrRow.querySelector(`[data-key="${key}"]`);
                        if (input && !input.value && val) { input.value = val; _fireInput(input); }
                    });
                    const fromStation = arrRow.querySelector('[data-key="fromStation"]');
                    if (fromStation && !fromStation.value) { fromStation.value = depStation; _fireInput(fromStation); }
                    const toStation = depRow.querySelector('[data-key="toStation"]');
                    if (toStation && !toStation.value) { toStation.value = arrStation; _fireInput(toStation); }
                    matched++;
                } else {
                    unmatched++;
                }
            });
            StatsModule.update();
            AppActions.triggerAutoSave();
            // [X7-FIX] 对账填值后触发行管理，确保每个到达表末尾有空行可继续录入
            DOM.queryAll('.work-table[data-side="arrival"]').forEach(table => {
                const tbody = table.querySelector('tbody');
                const station = table.dataset.station;
                if (tbody && station) DataModule._ensureEmptyBuffer(tbody, station, 'arrival', 2);
            });
            Modal.show({
                title: '对账完成',
                content: `⚡ 高速比对完毕：自动关联 ${matched} 条，剩余 ${unmatched} 条未匹配。`
            });
        } catch (e) {
            Logger.error('Reconcile failed', e);
        }
    }
};

                                    ${icon} ${h.shift}
                                </span>

                    `;

            }
            html += '</div>';

            Modal.show({
                title: `📅 历史记录 (${histories.length}条)`,
                content: html,
                isHTML: true   // [NEW-9b] 明确声明此内容为受信任的 HTML（由内部代码生成，已转义用户数据）
            });

            // [MEDIUM-E FIX] 事件委托：Modal 渲染完成后绑定，比 onclick 属性更安全
            setTimeout(() => {
                const listEl = document.getElementById('history-list');
                if (!listEl) return;
                listEl.addEventListener('click', (e) => {
                    const item = e.target.closest('[data-history-key]');
                    if (!item) return;
                    const key = item.dataset.historyKey;
                    if (key) HistoryModule.loadHistory(key);
                });
                listEl.addEventListener('mouseover', (e) => {
                    const item = e.target.closest('[data-history-key]');
                    if (item) item.style.filter = 'brightness(0.95)';
                });

            }, 0);
        } catch (e) {
            Logger.error('Open history failed', e);
            UI.toast('❌ 无法读取历史记录');
        }
    },

        // [Electron Refactor] 从主进程数据中获取历史键列表
    async _getHistories() {
        try {
            const keys = await Storage.scanHistoryKeys();
            return keys.slice(0, 20).map(({ key, timestamp }) => {
                const dt = new Date(timestamp);
                const h  = dt.getHours();
                return {
                    key,
                    timestamp,
                    dateStr: dt.toLocaleDateString('zh-CN'),
                    timeStr: dt.toLocaleTimeString('zh-CN'),
                    shift: (h >= 6 && h < 18) ? '白班' : '夜班'
                };
            });
        } catch (e) {
            Logger.error('Get histories failed', e);
            return [];
        }
    },

    async loadHistory(fullKey) {
        try {
            const data = await Storage.get(fullKey);
            if (!data) { UI.toast('❌ 历史数据不存在'); return; }
            AppState.setHistoryMode(true);
            const success = await DataModule.loadData(data);
            if (success) {
                Modal.close();
                UI.toast(`📖 已加载历史记录`);
            } else {
                AppState.setHistoryMode(false);
                UI.toast('❌ 加载失败');
            }
        } catch (e) {
            AppState.setHistoryMode(false);
            Logger.error('Load history failed', e);
        }
    },

    async loadPrevious() {
        try {
            const data = await Storage.get(CONFIG.KEYS.PREVIOUS_BACKUP);
            if (!data) { UI.toast('未发现历史快照'); return; }
            const targetData = (data && data.payload) ? data.payload : data;
            AppState.setHistoryMode(true);
            const success = await DataModule.loadData(targetData);
            if (success) {
                UI.toast('📖 已加载上一班数据');
            } else {
                AppState.setHistoryMode(false);
                UI.toast('❌ 加载失败');
            }
        } catch (e) {
            AppState.setHistoryMode(false);
            Logger.error('Load previous failed', e);
        }
    },

    async exitHistory() {
        try {
            if (!AppState.system.isHistoryMode) return;
            // [SRE-FIX] 先加载当前数据，成功后才解锁界面，防止加载失败时
            // 界面已可编辑但显示的是历史数据，操作员误保存导致主数据被历史数据覆盖
            Storage._invalidateCache();
            const allData = await Storage._loadAllData();
            const currentData = allData[CONFIG.KEYS.MAIN_DATA];
            if (currentData) {
                const ok = await DataModule.loadData(currentData);
                if (!ok) throw new Error('主数据加载校验失败');
                AppState.setHistoryMode(false);
                UI.toast('✅ 已返回当前班次');
            } else {
                // 无主数据（新班次尚未保存），解锁并渲染空白界面
                AppState.setHistoryMode(false);
                RenderModule.renderStations();
                RenderModule.renderStats();
                RenderModule.renderInventory();
                DOMCache.refreshTables();
                UI.toast('✅ 已返回当前班次');
            }
        } catch (e) {
            Logger.error('Exit history failed', e);
            // [SRE-FIX] 失败时严禁停留在可编辑的历史界面，强制重载
            location.reload();
        }
    }
};

/* ==================== 24. 主要操作模块 ==================== */
const AppActions = {
    _autoSaveTimer: null,
    _saveQueue: Promise.resolve(),

    triggerAutoSave() {
        try {
            if (AppState.system.isHistoryMode) return;
            AppState.data.modified = true;
            SaveIndicator.setModified();
            clearTimeout(this._autoSaveTimer);
            this._autoSaveTimer = setTimeout(() => {
                this._saveQueue = this._saveQueue
                    .then(() => this._performAutoSave())
                    .catch(e => Logger.error('Save queue error', e));
                SaveIndicator.setPending();
            }, CONFIG.AUTO_SAVE_INTERVAL); // [S1-FIX] 补全 setTimeout 回调的 } 和 ) 及分号
        } catch (e) {
            Logger.error('Trigger auto save failed', e);
        }
    },

    async _performAutoSave() {
        // [SIMPLIFY] 移除 requestIdleCallback 调度，直接执行
        // 1. 基础检查：是否正在保存、是否历史模式、是否有数据变更
        if (AppState.system.isSaving || AppState.system.isHistoryMode) return;
        if (!AppState.data.modified) return; // 数据未变更，直接返回，不打扰硬盘

        AppState.system.isSaving = true;
        
        // 2. 锁定手动保存按钮，防止冲突
        const saveBtn = document.getElementById(DOM_IDS.BTN_MANUAL_SAVE);
        if (saveBtn) saveBtn.disabled = true;

        // 3. 设置 UI 状态
        SaveIndicator.setPending();

        try {
            const data = await DataModule.getCurrentData();
            
            // 4. 执行保存 (await 确保串行)
            if (data) {
                const success = await Storage.saveMainData(data);
                
                if (success) {
                    AppState.data.modified = false;
                    AppState.data.lastSaved = Date.now();
                    SaveIndicator.setSaved();
                    // 仅记录日志，不再进行复杂的 IPC 通信
                    // Logger.info('Auto saved'); 
                } else {
                    SaveIndicator.setFailed();
                }
            }
        } catch (e) {
            console.error('[AutoSave] Failed', e);
            SaveIndicator.setFailed();
        } finally {
            // 5. 释放锁和按钮
            AppState.system.isSaving = false;
            if (saveBtn) saveBtn.disabled = false;
        }
    },

        async manualSave() {
        try {
            if (AppState.system.isHistoryMode) { UI.toast("⚠️ 历史模式无法保存"); return; }
            // [HIGH-NEW-2 FIX] 连续点击保存时，若上一次保存仍在进行，直接提示并返回。
            // 防止 _saveQueue Promise 链无限堆积，以及 await this._saveQueue 长时间阻塞按钮。
            if (AppState.system.isSaving) { UI.toast("⏳ 正在保存中，请稍候..."); return; }

            // 1. 取消 pending 的自动保存，避免重复写入
            clearTimeout(this._autoSaveTimer);
            this._autoSaveTimer = null;

            // 2. [R2-FIX] 直接入队，不再嵌套 new Promise，消除状态不一致风险
            this._saveQueue = this._saveQueue
                .then(() => this._doManualSave())
                .catch(e => Logger.error('manualSave queue error', e));
            await this._saveQueue;
        } catch (e) {
            Logger.error('Manual save wrapper failed', e);
            UI.toast("❌ 保存异常：" + e.message);
        }
    },

    // [R2-FIX] 独立提取保存逻辑，职责单一，便于测试和维护
    async _doManualSave() {
        if (AppState.system.isSaving) return; // 已有保存在进行，跳过
        AppState.system.isSaving = true;
        const saveBtn = document.getElementById(DOM_IDS.BTN_MANUAL_SAVE);
        if (saveBtn) saveBtn.disabled = true;
        try {
            const data = await DataModule.getCurrentData();
            if (!data) {
                UI.toast("❌ 获取数据失败");
                return;
            }
            if (!DataPureFunctions.validateDataSchema(data)) {
                UI.toast("⚠️ 数据结构异常，拒绝保存");
                return;
            }
            const success = await Storage.saveMainData(data);
            if (!success) throw new Error('saveMainData returned false');
            // [Y18-FIX] 删除多余的 _invalidateCache()：saveMainData→Storage.set 成功时已更新缓存，
            // 再 invalidate 会清掉刚写好的缓存，导致下次操作多一次无谓 IO
            AppState.data.modified = false;
            AppState.data.lastSaved = Date.now();
            UI.toast("✅ 数据已保存");
            SaveIndicator.setSaved();
        } catch (err) {
            Logger.error('_doManualSave failed', err);
            UI.toast("❌ 保存异常：" + (err.message || "未知错误"));
            SaveIndicator.setFailed();
        } finally {
            AppState.system.isSaving = false;
            if (saveBtn) saveBtn.disabled = false;
        }
    },

    // [Electron Refactor] 历史键扫描通过 Storage.scanHistoryKeys（从主进程数据中提取）
    _scanHistoryKeysDone: [],
    _scanHistoryKeys() {
        // 同步版本返回已缓存的键列表（异步获取由 _cleanupHistory 等负责）
        return this._scanHistoryKeysDone;
    },

    async _scanHistoryKeysAsync() {
        this._scanHistoryKeysDone = await Storage.scanHistoryKeys();
        return this._scanHistoryKeysDone;
    },

    async _cleanupHistory(maxCount = CONFIG.HISTORY_MAX_COUNT, maxAgeDays = CONFIG.HISTORY_MAX_DAYS) {
        const now      = Date.now();
        const maxAgeMs = maxAgeDays * 24 * 3600 * 1000;
        const allKeys  = await this._scanHistoryKeysAsync();

        const toDelete = [];
        const valid    = [];
        for (const h of allKeys) {
            if (maxAgeMs > 0 && now - h.timestamp > maxAgeMs) {
                toDelete.push(h);
                Logger.info(`Will delete expired: ${h.key}`);
            } else {
                valid.push(h);
            }
        }
        valid.slice(maxCount).forEach(h => {
            toDelete.push(h);
            Logger.info(`Will delete excess: ${h.key}`);
        });

        if (toDelete.length === 0) return;

        const allData = await Storage._loadAllData();
        // [R17-FIX] 浅拷贝后再删除，不直接修改 _cachedAllData 引用，防止缓存污染
        const nextData = Object.assign({}, allData);
        toDelete.forEach(h => {
            delete nextData[h.key];
            delete nextData[h.key + '_BAK'];
        });
        // [QUEUE-CLEANUP FIX] 通过 _enqueueWrite 串行化，防止与并发 Storage.set 产生写竞争
        await Storage._enqueueWrite(async () => {
            const result = await window.electronAPI.saveData(nextData);
            if (result && result.success) {
                Storage._cachedAllData = nextData;
                Storage._cacheTs = Date.now();
                Logger.info(`Cleanup complete: deleted ${toDelete.length} history entries in 1 write`);
            } else {
                Storage._invalidateCache();
                Logger.error('Cleanup write failed');
            }
        });
    },

    async confirmHandover() {
        try {
            if (AppState.system.isHistoryMode) { UI.toast('⚠️ 历史模式下无法交班，请先返回当前'); return; }
            // [R4-FIX] 交班前检查保存锁，避免与 autoSave 并发
            if (AppState.system.isSaving) { UI.toast('⚠️ 正在保存中，请稍后再交班'); return; }

            // [R9-FIX] 增加二次确认，防止误触
            Modal.show({
                title: '⚠️ 确认交班',
                content: '交班将保存本班数据并清空记录，开始新班次。\n\n确定现在交班吗？',
                onConfirm: () => this._doConfirmHandover()
            });
        } catch (e) {
            Logger.error('Confirm handover failed', e);
            UI.toast('❌ 交班失败：' + e.message);
        }
    },

    async _doConfirmHandover() {
        try {
            if (document.activeElement && typeof document.activeElement.blur === 'function') {
                document.activeElement.blur();
            }
            // [SRE-FIX] 立即上锁，封堵 Storage.set(historyKey) await 期间 autoSave 并发写入的真空期
            AppState.system.isSaving = true;
            // [FATAL-DOM FIX] 同步抓取 DOM 数据（blur() 已保证输入框值已提交）
            // [HANDOVER-TIMEOUT FIX] 移除 setTimeout 50ms：preSnapshot 已同步抓到，
            // setTimeout 是多余的真空期，可能导致息屏同时触发 _asyncSaveOnHide 与交班并发
            const preSnapshot = DataModule.collectCurrentDataSync();
            (async () => {
                try {
                    const data = preSnapshot || await DataModule.getCurrentData();
                    if (!data) { AppState.system.isSaving = false; UI.toast('❌ 获取数据失败'); return; }
                    const now   = new Date();
                    const h     = now.getHours();
                    const shift = (h >= 6 && h < 18) ? '白班' : '夜班';
                    data.shift     = shift;
                    data.shiftDate = now.toLocaleDateString('zh-CN');
                    data.shiftTime = now.toLocaleTimeString('zh-CN', { hour12: false });

                    const historyKey = `HF_HISTORY_${Util.monoId()}`;
                    await Storage.set(historyKey, data);

                    if (window.electronAPI && window.electronAPI.saveBackup) {
                        const _backupNow = new Date();
                        const _pad = n => String(n).padStart(2, '0');
                        const _today   = `${_backupNow.getFullYear()}-${_pad(_backupNow.getMonth()+1)}-${_pad(_backupNow.getDate())}`;
                        const _timeStr = `${_pad(_backupNow.getHours())}-${_pad(_backupNow.getMinutes())}-${_pad(_backupNow.getSeconds())}`;
                        const filename  = `backup_${_today}_${_timeStr}.json`;
                        try {
                            await window.electronAPI.saveBackup(filename, JSON.stringify(data, null, 2));
                            UI.toast('✅ 已自动备份到backup文件夹');
                        } catch (err) {
                            Logger.error('Backup failed', err);
                            UI.toast('⚠️ 自动备份失败，但继续交班');
                        }
                    } else {
                        UI.toast('✅ 已保存到历史记录');
                    }

                    await this._executeHandover(data);
                } catch (innerErr) {
                    Logger.critical('Handover inner execution failed', innerErr);
                    UI.toast('❌ 交班执行异常：' + (innerErr.message || '未知错误'));
                    // [FATAL-1 FIX] Storage.set(historyKey) 失败时 _executeHandover 从未执行，
                    // 其 finally 不会运行，必须在此处补充释放锁，否则整班 autoSave 全部被阻塞
                    AppState.system.isSaving = false;
                }
            })().catch(e => {
                // [HIGH-NEW-1 FIX] IIFE 兜底 catch：理论上内层 try/catch 已全覆盖，
                // 此处防止 V8 极端场景下漏出的 unhandledrejection 触发全局错误计数器，
                // 误判为启动崩溃并弹出停机屏。
                Logger.critical('Handover IIFE uncaught escape', e);
                AppState.system.isSaving = false;
                UI.toast('❌ 交班异常（兜底）：' + (e && e.message ? e.message : '未知错误'));
            });
        } catch (e) {
            AppState.system.isSaving = false; // [FATAL-1 FIX] 外层同步catch释放锁
            Logger.error('_doConfirmHandover failed', e);
            UI.toast('❌ 交班失败：' + e.message);
        }
    },

    async _executeHandover(currentData) {
        try {
            clearTimeout(this._autoSaveTimer);
            this._autoSaveTimer = null;
            AppState.system.isSaving = true;
            // [ATOM-FIX] 不在这里提前清 modified：新班次写盘失败时 modified 保持 true，
            // SaveIndicator 继续显示"待存"，操作员不会被误导以为数据安全

            await Storage.set(CONFIG.KEYS.PREVIOUS_BACKUP, {
                timestamp: Date.now(),
                duty: AppState.data.currentDuty,
                payload: currentData
            });
            Storage._invalidateCache();

            const newData = {
                version: CONFIG.VERSION,
                timestamp: Date.now(),
                duty: AppState.data.currentDuty,
                stations: {},
                notes: { imp: '', safe: '', hand: '设备良好，安全无事' },
                inv: currentData.inv || {},
                rets: []
            };

            AppState.config.stations.forEach(s => {
                newData.stations[s] = {
                    arrival: [],
                    departure: DataPureFunctions.rolloverDepartureRows(currentData.stations[s]?.departure || [])
                };
            });

            if (currentData.rets) {
                newData.rets = currentData.rets
                    .filter(ret => !ret.t || ret.t.trim() === '')
                    .map(ret => ({ ...ret, _isHandover: true }));
            }

            // [Electron Refactor] 通过 electronAPI 写入新班次初始数据
            const saveSuccess = await Storage.saveMainData(newData);
            if (!saveSuccess) throw new Error('Post-handover saveMainData failed');
            // [ATOM-FIX] 只有新班次落盘成功，才标记数据干净、刷新缓存
            Storage._invalidateCache();
            AppState.data.modified = false;

            // [HIGH-D FIX] 交班后立即清理历史，避免工控机长时间不重启时历史累积
            try { await this._cleanupHistory(); } catch (ce) { Logger.warn('Post-handover cleanup failed', ce); }

            UI.toast('✅ 交班成功，正在刷新...');
            setTimeout(() => {
                if (window.electronAPI && typeof window.electronAPI.reloadWindow === 'function') {
                    window.electronAPI.reloadWindow().catch(() => location.reload());
                } else {
                    location.reload();
                }
            }, 1000);
        } catch (e) {
            Logger.error('Execute handover failed', e);
            UI.toast('❌ 交班执行失败：' + e.message);
        } finally {
            // [FATAL-B FIX] 无论成功或失败都重置锁，防止整班后续保存全部失效
            AppState.system.isSaving = false;
        }
    },
};

/* ==================== 25. 管理面板模块 ==================== */
const AdminPanel = {
    _draggingEl: null,

    // [MED-NEW-3 FIX] 实例方法替代闭包：不持有任何特定 container 引用，
    // 遍历当前所有活跃 .tag-container 元素执行清理，保证第N次打开面板后也能正常重置。
    _resetAllDragState() {
        if (this._draggingEl) {
            this._draggingEl.classList.remove('dragging');
            this._draggingEl = null;
        }
        document.body.classList.remove('is-dragging-tag');
        document.querySelectorAll('[data-hasDragEvents]').forEach(c => c.classList.remove('drag-over'));
    },

    open() {
        try {
            const overlay = DOM.getElement(DOM_IDS.ADMIN_OVERLAY);
            if (!overlay) return;
            this._populateTags();
            overlay.style.display = 'flex';
            document.body.classList.add('modal-open');
        } catch (e) {
            Logger.error('Open admin failed', e);
        }
    },

    close() {
        try {
            const overlay = DOM.getElement(DOM_IDS.ADMIN_OVERLAY);
            if (overlay) { overlay.style.display = 'none'; this._draggingEl = null; }
            document.body.classList.remove('modal-open');
        } catch (e) {
            Logger.error('Close admin failed', e);
        }
    },

    _populateTags() {
        try {
            this._renderTags('tags-stations',     AppState.config.stations);
            this._renderTags('tags-duties',        AppState.config.duties);
            this._renderTags('tags-inv-stations',  AppState.config.invStations);
            ['stations', 'duties', 'inv-stations'].forEach(type => {
                const input = DOM.getElement(`input-${type}`);
                if (input) {
                    input.onkeydown = (e) => {
                        if (e.key === 'Enter') {
                            e.preventDefault();
                            const value = input.value.trim();
                            if (value) {
                                const container = DOM.getElement(`tags-${type}`);
                                this._addTag(container, value);
                                input.value = '';
                            }
                        }
                    };
                }
            });
        } catch (e) {
            Logger.error('Populate tags failed', e);
        }
    },

    _renderTags(containerId, items) {
        try {
            const container = DOM.getElement(containerId);
            if (!container) return;
            container.innerHTML = '';
            // [HIGH-4 FIX] 不删除 hasDragEvents 标记：ondragstart/ondragend 已改为属性赋值（幂等），
            // 但保留标记可避免 _initContainerDrag 被不必要地重复调用，代码更干净
            // delete container.dataset.hasDragEvents;  ← 已永久注释
            items.forEach(item => this._addTag(container, item));
        } catch (e) {
            Logger.error('Render tags failed', e);
        }
    },

    _addTag(container, text) {
        try {
            const tag = document.createElement('span');
            tag.className = 'tag-item';
            tag.dataset.tagText = text;
            tag.setAttribute('draggable', 'true');
            tag.appendChild(document.createTextNode(text));
            if (!container.dataset.hasDragEvents) {
                this._initContainerDrag(container);
                container.dataset.hasDragEvents = 'true';
            }
            const closeBtn = document.createElement('span');
            closeBtn.className = 'close-btn';
            closeBtn.innerHTML = '&times;';
            closeBtn.onclick = (e) => { e.stopPropagation(); tag.remove(); };
            tag.appendChild(closeBtn);
            container.appendChild(tag);
        } catch (e) {
            Logger.error('Add tag failed', e);
        }
    },

    _initContainerDrag(container) {
        // [FATAL-3 FIX] 每次打开设置面板 _renderTags 会重置 hasDragEvents，导致 _initContainerDrag
        // 被重复调用。addEventListener 注册的 dragstart/dragend 会叠加（每打开一次多一个 handler），
        // 改为属性赋值（ondragstart/ondragend），后赋值覆盖前值，从根源消除重复注册。
        // [MED-DRAG FIX] window 级 mouseup/blur 兜底：鼠标拖出窗口松开时 dragend 不触发，
        // is-dragging-tag 永久残留在 body，导致 tag-item pointer-events:none 无法点击。
        // [MED-NEW-3 FIX] 原实现用闭包捕获 container 引用，第二次打开面板后 _renderTags 会
        // innerHTML='' 重建容器，旧闭包中的 container 已是废弃 DOM 节点，
        // container.classList.remove('drag-over') 无效，is-dragging-tag 残留导致 tag 无法点击。
        // 改为实例方法 _resetAllDragState，遍历所有 .tag-container 清理，不依赖特定 container 引用。
        if (!window._dragResetBound) {
            window.addEventListener('mouseup', () => this._resetAllDragState());
            window.addEventListener('blur',    () => this._resetAllDragState());
            window._dragResetBound = true;
        }
        let isScheduled = false;
        container.ondragstart = (e) => {
            const tag = e.target.closest('.tag-item');
            if (!tag || tag.parentNode !== container) return;
            this._draggingEl = tag;
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', tag.dataset.tagText || '');
            setTimeout(() => { tag.classList.add('dragging'); document.body.classList.add('is-dragging-tag'); }, 0);
        };
        container.ondragend = (e) => {
            const tag = e.target.closest('.tag-item');
            if (tag) tag.classList.remove('dragging');
            this._draggingEl = null;
            container.classList.remove('drag-over');
            document.body.classList.remove('is-dragging-tag');
        };
        container.ondragover = (e) => {
            e.preventDefault();
            e.stopPropagation(); // [HIGH-DRAGCURSOR FIX] 阻止冒泡到 document 的全局 dragover 监听器，
            // 防止 document 级 dropEffect='none' 覆盖此处的 'move'，导致拖拽显示禁止光标
            if (!this._draggingEl || this._draggingEl.parentNode !== container) return;
            container.classList.add('drag-over');
            if (isScheduled) return;
            isScheduled = true;
            requestAnimationFrame(() => {
                isScheduled = false;
                const afterElement = this._getDragAfterElement(container, e.clientX, e.clientY);
                const currentNext  = this._draggingEl.nextElementSibling;
                if (afterElement !== currentNext) {
                    if (afterElement) container.insertBefore(this._draggingEl, afterElement);
                    else container.appendChild(this._draggingEl);
                }
            });
        };
        container.ondragleave = () => container.classList.remove('drag-over');
        container.ondrop = (e) => { e.preventDefault(); e.stopPropagation(); container.classList.remove('drag-over'); }; // [HIGH-DRAGCURSOR FIX]
    },

    _getDragAfterElement(container, x, y) {
        const draggableElements = [...container.querySelectorAll('.tag-item:not(.dragging)')];
        return draggableElements.reduce((closest, child) => {
            const box = child.getBoundingClientRect();
            const dx  = x - (box.left + box.width / 2);
            const dy  = y - (box.top  + box.height / 2);
            const distance = dx * dx + dy * dy;
            return distance < closest.distance ? { distance, element: child } : closest;
        }, { distance: Number.POSITIVE_INFINITY }).element;
    },

    _isApplying: false,

    applyConfig() {
        // [MED-NEW-2 FIX] 防止 close() 后50ms窗口内重复点击，导致两个 Modal 叠加
        // 并触发两次 _doApplyConfig → 两次 reload 相互竞争行为未定义。
        // _isApplying 随 reload 自动重置，无需手动释放。
        if (this._isApplying) return;
        this._isApplying = true;
        this.close();
        setTimeout(() => { this._checkOrphanData(); }, 50);
    },

    _checkOrphanData() {
        try {
            const newStations = this._getTags('tags-stations');
            const oldStations = AppState.config.stations;
            const removedOrRenamed = oldStations.filter(s => !newStations.includes(s));

            if (removedOrRenamed.length > 0) {
                const currentData = DataModule.collectCurrentDataSync();
                let hasOrphanData = false;
                removedOrRenamed.forEach(s => {
                    if (currentData.stations[s]) {
                        const dep = currentData.stations[s].departure || [];
                        const arr = currentData.stations[s].arrival   || [];
                        if (dep.length > 0 || arr.length > 0) hasOrphanData = true;
                    }
                });
                if (hasOrphanData) {
                    Modal.show({
                        title: "🚨 危险操作警告！",
                        content: `以下车站已被删除或改名：\n${removedOrRenamed.map(s => `  • ${s}`).join('\n')}\n\n这些车站的当前记录将【永久丢失】，无法恢复！\n\n如有重要数据，请先取消并手动交班后再修改配置。\n\n确定要继续吗？`,
                        onConfirm: () => { this._doApplyConfig(); }
                    });
                    return;
                }
            }

            Modal.show({
                title: "⚠️ 配置重启警告",
                content: "更改配置将重启界面！\n系统将为您自动暂存和恢复当前数据。\n\n确定要继续吗？",
                onConfirm: () => { this._doApplyConfig(); }
            });
        } catch (e) {
            Logger.error('Config check failed', e);
            UI.toast("❌ 配置检查出错");
            this.open();
        }
    },

    async _doApplyConfig() {
        try {
            // [SRE-FIX] 配置写入期间上锁，防止 autoSave 并发写入造成数据互相覆盖
            // reload 前不需要手动释放，渲染进程重建后锁自动清除
            AppState.system.isSaving = true;
            const currentData = await DataModule.getCurrentData();
            if (currentData) await Storage.set(CONFIG.KEYS.SETTINGS_CHANGE_BACKUP, currentData);

            const newConfig = {
                stations:    this._getTags('tags-stations'),
                duties:      this._getTags('tags-duties'),
                invStations: this._getTags('tags-inv-stations')
            };
            newConfig.dropdowns = newConfig.stations.slice();

            await Storage.set(CONFIG.KEYS.SETTINGS, newConfig);
            // [AUDIT-FIX-11] 同 BUG-8，Electron 中优先用 reloadWindow
            if (window.electronAPI && typeof window.electronAPI.reloadWindow === 'function') {
                await window.electronAPI.reloadWindow();
            } else {
                location.reload();
            }
        } catch (e) {
            Logger.error('Apply config failed', e);
            // [S9-FIX] 配置应用失败时【不删除】settingsBackup，
            // 保留备份让下次重启能恢复用户数据，只撤销 SETTINGS 写入（主进程原子写，失败不影响旧值）
            UI.toast("❌ 配置应用失败：" + e.message);
            this.open();
        } finally {
            // [FATAL-1 FIX] finally 确保无论 reload/catch/正常路径，锁必然释放
            // reload 前执行一次无害，catch 路径确保 autoSave 不被永久阻塞
            AppState.system.isSaving = false;
        }
    },

    _getTags(containerId) {
        try {
            const container = DOM.getElement(containerId);
            if (!container) return [];
            return Array.from(container.querySelectorAll('.tag-item'))
                // [MED-NEW-1 FIX] 拖拽异常导致 firstChild 为 null 时，回退读取 data-tagText，
                // 两者都缺失则过滤掉，防止 _doApplyConfig 把空字符串写入配置，保存后车站/班次全丢
                .map(tag => (tag.firstChild ? tag.firstChild.textContent.trim() : (tag.dataset.tagText || '').trim()))
                .filter(Boolean);
        } catch (e) {
            Logger.error('Get tags failed', e);
            return [];
        }
    }
};

/* ==================== 26. 键盘导航模块 ==================== */
const KeyboardNavModule = {
    SKIP_KEYS: ['toStation', 'fromStation'],
    _initialized: false,

    init() {
        // [FATAL-2 FIX] document 级监听器，重复注册会叠加，必须守卫
        if (this._initialized) return;
        this._initialized = true;
        try {
            document.addEventListener('keydown', (e) => {
                // [Electron Refactor] 禁用刷新键：F5 和 Ctrl+R，防止工控机误操作
                if (e.key === 'F5') {
                    e.preventDefault();
                    UI.toast('⚠️ 刷新已禁用，请使用系统菜单操作');
                    return;
                }
                if ((e.ctrlKey || e.metaKey) && (e.key === 'r' || e.key === 'R')) {
                    e.preventDefault();
                    UI.toast('⚠️ 刷新已禁用，请使用系统菜单操作');
                    return;
                }
                this._handleKeyNav(e);
            });
            Logger.info('Keyboard nav initialized (Excel Style) [Electron Refactor]');
        } catch (e) {
            Logger.error('Keyboard nav init failed', e);
        }
    },

    _handleKeyNav(e) {
        try {
            if (AppState.system.isHistoryMode) return;
            if (document.body.classList.contains('modal-open')) return;
            const el = document.activeElement;
            if (!this._isInput(el)) return;
            const td = el.closest('td');
            const tr = el.closest('tr');
            if (!td || !tr) return;
            const colIndex = Array.from(tr.children).indexOf(td);
            switch(e.key) {
                case "Enter":
                    e.preventDefault(); this._moveNext(tr, colIndex, 1); break;
                case "Tab":
                    e.preventDefault(); this._moveNext(tr, colIndex, e.shiftKey ? -1 : 1); break;
                case "ArrowDown":
                    e.preventDefault(); this._moveVertical(tr, colIndex, 1); break;
                case "ArrowUp":
                    e.preventDefault(); this._moveVertical(tr, colIndex, -1); break;
                case "ArrowRight":
                    if (this._shouldMoveHorizontal(el, 'right')) { e.preventDefault(); this._moveNext(tr, colIndex, 1); } break;
                case "ArrowLeft":
                    if (this._shouldMoveHorizontal(el, 'left'))  { e.preventDefault(); this._moveNext(tr, colIndex, -1); } break;
            }
        } catch (e) {
            Logger.error('Key nav handler failed', e);
        }
    },

    _isInput(el) {
        return el && (el.classList.contains('row-input') ||
                      el.classList.contains('ret-input') ||
                      el.classList.contains('inv-input'));
    },

    _moveNext(currentTr, colIndex, direction) {
        let nextTr  = currentTr;
        let nextCol = colIndex + direction;
        let safetyCounter = 0;
        const MAX_STEPS = 3600; // MAX_ROWS_PER_TABLE(500) × FIELDS(6) × 略余量
        while (safetyCounter++ < MAX_STEPS) {
            if (nextCol >= nextTr.children.length) {
                nextTr = nextTr.nextElementSibling;
                if (!nextTr) return;
                nextCol = 0;
            } else if (nextCol < 0) {
                nextTr = nextTr.previousElementSibling;
                if (!nextTr) return;
                nextCol = nextTr.children.length - 1;
            }
            const targetTd = nextTr.children[nextCol];
            if (!targetTd) { nextCol += direction; continue; }
            const input = targetTd.querySelector('.row-input, .ret-input, .inv-input');
            const shouldSkip = input?.dataset.key && this.SKIP_KEYS.includes(input.dataset.key);
            if (input && !input.disabled && !input.readOnly && !shouldSkip) {
                this._focusInput(input, false);
                return;
            }
            nextCol += direction;
        }
    },

    _moveVertical(currentTr, colIndex, direction) {
        // [W5-FIX] 跳过 history-ref-row，避免光标静默停在只读参考行
        let targetTr = direction === 1 ? currentTr.nextElementSibling : currentTr.previousElementSibling;
        while (targetTr && targetTr.classList.contains('history-ref-row')) {
            targetTr = direction === 1 ? targetTr.nextElementSibling : targetTr.previousElementSibling;
        }
        if (targetTr) {
            const targetTd = targetTr.children[colIndex];
            const input    = targetTd?.querySelector('.row-input, .ret-input, .inv-input');
            if (input && !input.disabled && !input.readOnly) this._focusInput(input, false);
        }
    },

    _focusInput(input, selectAll = true) {
        setTimeout(() => {
            input.focus();
            // type="number" 和 type="checkbox" 不支持 select()/setSelectionRange()，跳过
            if (input.tagName === 'INPUT' && input.type !== 'checkbox' && input.type !== 'number') {
                if (selectAll) {
                    input.select();
                } else {
                    const len = input.value.length;
                    input.setSelectionRange(len, len);
                }
            }
        }, 0);
    },

    _shouldMoveHorizontal(el, direction) {
        if (el.tagName === 'SELECT' || el.type === 'number') return true;
        if (direction === 'right') return el.selectionStart === el.value.length;
        return el.selectionStart === 0;
    }
};
